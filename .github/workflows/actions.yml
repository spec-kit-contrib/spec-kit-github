name: Actions
on:
  push:
    branches: [main]
    paths: [".github/actions/**", ".github/workflows/actions.yml"]
  pull_request:
    paths: [".github/actions/**", ".github/workflows/actions.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/actions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/actions/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist is current
        run: git diff --exit-code -- '*/dist'
