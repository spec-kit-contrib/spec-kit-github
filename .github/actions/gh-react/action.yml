name: Spec Kit react
description: Show the state of a command as a reaction on the comment that gave it, or on the issue for an assignment.
inputs:
  github-app:
    description: The account the reactions are made as. Only its own state reactions are replaced. Defaults to github-actions[bot].
  github-token:
    required: true
    description: Token of the agent's account, with issues and pull-requests write.
  content:
    required: true
    description: "eyes (running), +1 (done) or confused (failed). The agent's other state reactions are removed."
runs:
  using: node24
  main: dist/index.cjs
